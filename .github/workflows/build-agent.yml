name: build-agent

# 로컬 에이전트 배포본을 각 OS의 "진짜 머신"(GitHub 러너)에서 빌드 + 스모크 테스트 + 산출물 업로드.
# → 개발 맥이 아니라 깨끗한 환경에서 재현, 그리고 Windows 패키지를 Windows 머신 없이 빌드/검증.

on:
  push:
    # main 브랜치 push 만(태그 push 는 제외 — 릴리스 태그 push 가 version 입력 없는
    # 스트레이 빌드를 만들어 릴리스 스크립트가 엉뚱한 런을 잡던 문제를 막는다).
    branches: [main]
    paths:
      - "apps/agent/**"
      - "packages/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 태그(예: agent-v0.3.1). 비우면 git 태그(git describe)로 자동 판정."
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: "dist:macos"
            artifact: macos-dist
          - os: windows-latest
            script: "dist:windows"
            artifact: win-dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 루트 package.json의 packageManager 필드에서 자동 감지(version 명시하면 충돌).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 버전 스탬프: workflow_dispatch 로 version 을 주면 그 값을(릴리스), 없으면 빈 값 →
      # package-app.mjs 가 git describe 로 자동 판정(일반 push 빌드). 빈 문자열은 무시된다.
      - name: Build distributable
        env:
          AGENT_VERSION: ${{ github.event.inputs.version }}
        run: pnpm --filter @qualiflow/agent ${{ matrix.script }}

      # 동봉 node로 번들이 실제로 도는지(=external 의존성 해석 + 임포트 OK) 확인. 계정 없으면 "없음" + exit 0.
      - name: Smoke test (bundled node runs the agent)
        shell: bash
        run: |
          export QUALIFLOW_HOME="${RUNNER_TEMP}/qf"
          cd apps/agent/dist/package
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./node.exe agent.mjs accounts
          else
            ./node agent.mjs accounts
          fi

      # 상주 마법사(wizard)가 실제로 뜨는지 회귀검증. install.bat/install.command 과 동일하게
      # 백그라운드로 wizard 를 띄우고 4317 응답을 폴링 → /api/version 이 200 이면 통과 → 프로세스 종료.
      # (CI 러너는 4317 이 비어 있으므로 기본 포트 사용. Windows/mac 러너 모두 bash + 동봉 curl.)
      - name: Smoke test (wizard daemon starts and answers)
        shell: bash
        run: |
          export QUALIFLOW_HOME="${RUNNER_TEMP}/qf-wiz"
          cd apps/agent/dist/package
          if [ "${{ runner.os }}" = "Windows" ]; then NODE=./node.exe; else NODE=./node; fi
          "$NODE" agent.mjs wizard &
          WIZ_PID=$!
          # 종료 보장: 성공/실패 어느 경로로 빠지든 백그라운드 wizard 프로세스를 정리한다.
          trap 'kill "$WIZ_PID" 2>/dev/null || true' EXIT
          # 최대 ~20초(40 x 0.5s) 동안 /api/version 이 200 을 줄 때까지 폴링.
          for i in $(seq 1 40); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 1 http://127.0.0.1:4317/api/version)" = "200" ]; then
              echo "wizard OK (/api/version 200)"
              curl -s http://127.0.0.1:4317/api/version
              exit 0
            fi
            sleep 0.5
          done
          echo "wizard did not answer on 4317 within timeout" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: qualiflow-agent-${{ runner.os }}
          path: apps/agent/dist/${{ matrix.artifact }}
          retention-days: 14
